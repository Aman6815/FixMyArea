<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Create an account on Wolaita Reporter to report and track community problems.">

    <title>Register | Wolaita Reporter</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- =========================
         NAVIGATION
    ========================== -->
    <header class="navbar">

        <div class="container navbar-container">

            <a href="index.html" class="logo">

                <span class="logo-mark">
                    <span></span>
                    <span></span>
                    <span></span>
                </span>

                <span class="logo-text">
                    Wolaita<span>Reporter</span>
                </span>

            </a>


            <nav class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="reports.html">
                    Explore Problems
                </a>

                <a href="about.html">
                    About
                </a>

                <a href="login.html" class="nav-login">
                    Login
                </a>

                <a href="register.html" class="nav-register active">
                    Register
                </a>

                <a href="report.html" class="btn btn-primary">
                    Report a Problem
                </a>

            </nav>


            <button class="menu-toggle" aria-label="Open navigation menu">
                ☰
            </button>

        </div>

    </header>


    <!-- =========================
         REGISTRATION SECTION
    ========================== -->
    <main>

        <section class="auth-section">

            <div class="auth-container">

                <div class="auth-header">

                    <p class="section-label">
                        JOIN THE COMMUNITY
                    </p>

                    <h1>
                        Create Your Account
                    </h1>

                    <p>
                        Register to report problems and track
                        their progress in your community.
                    </p>

                </div>


                <!-- Registration Form -->
                <form class="auth-form" id="registerForm">

                    <!-- Full Name -->
                    <div class="form-group">

                        <label for="fullName">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="fullName"
                            name="fullName"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <!-- Email -->
                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- Phone -->
                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter your phone number"
                        >

                    </div>


                    <!-- Location -->
                    <div class="form-group">

                        <label for="location">
                            Your Area
                        </label>

                        <select id="location" name="location" required>

                            <option value="">
                                Select your area
                            </option>

                            <option value="sodo">
                                Sodo City
                            </option>

                            <option value="other">
                                Other Towns & Districts
                            </option>

                        </select>

                    </div>


                    <!-- Password -->
                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            required
                        >

                    </div>


                    <!-- Confirm Password -->
                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your password"
                            required
                        >

                    </div>


                    <!-- Submit -->
                    <button
                        type="submit"
                        class="btn btn-primary auth-button"
                    >
                        Create Account
                    </button>


                    <!-- Login Link -->
                    <p class="auth-footer">
                        Already have an account?
                        <a href="login.html">
                            Login here
                        </a>
                    </p>

                </form>

            </div>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->
    <footer class="footer">

        <div class="footer-bottom">

            <p>
                &copy; 2026 Wolaita Reporter.
                All rights reserved.
            </p>

        </div>

    </footer>


    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>

</body>

</html>
