<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Login to Wolaita Reporter to report and track community problems.">

    <title>Login | Wolaita Reporter</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- =========================
         NAVIGATION
    ========================== -->
    <header class="navbar">

        <div class="container navbar-container">

            <!-- Logo -->
            <a href="index.html" class="logo">

                <span class="logo-mark">
                    <span></span>
                    <span></span>
                    <span></span>
                </span>

                <span class="logo-text">
                    Wolaita<span>Reporter</span>
                </span>

            </a>


            <!-- Navigation -->
            <nav class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="reports.html">
                    Explore Problems
                </a>

                <a href="my-reports.html">
                    My Reports
                </a>

                <a href="about.html">
                    About
                </a>

                <a href="login.html" class="nav-login active">
                    Login
                </a>

                <a href="register.html" class="nav-register">
                    Register
                </a>

                <a href="report.html" class="btn btn-primary">
                    Report a Problem
                </a>

            </nav>


            <!-- Mobile Menu -->
            <button class="menu-toggle" aria-label="Open navigation menu">
                ☰
            </button>

        </div>

    </header>


    <!-- =========================
         LOGIN SECTION
    ========================== -->
    <main>

        <section class="auth-section">

            <div class="auth-container">

                <div class="auth-header">

                    <p class="section-label">
                        WELCOME BACK
                    </p>

                    <h1>
                        Login to Your Account
                    </h1>

                    <p>
                        Login to report problems and track
                        the progress of your reports.
                    </p>

                </div>


                <!-- Login Form -->
                <form class="auth-form" id="loginForm">

                    <!-- Email -->
                    <div class="form-group">

                        <label for="loginEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="loginEmail"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- Password -->
                    <div class="form-group">

                        <label for="loginPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <!-- Remember Me -->
                    <div class="remember-me">

                        <label>
                            <input
                                type="checkbox"
                                id="rememberMe"
                            >

                            Remember me
                        </label>

                    </div>


                    <!-- Submit -->
                    <button
                        type="submit"
                        class="btn btn-primary auth-button"
                    >
                        Login
                    </button>


                    <!-- Register Link -->
                    <p class="auth-footer">

                        Don't have an account?

                        <a href="register.html">
                            Register here
                        </a>

                    </p>

                </form>

            </div>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->
    <footer class="footer">

        <div class="footer-bottom">

            <p>
                &copy; 2026 Wolaita Reporter.
                All rights reserved.
            </p>

        </div>

    </footer>


    <!-- JavaScript -->
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>

</body>

</html>
